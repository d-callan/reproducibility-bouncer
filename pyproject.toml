[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reproducibility-bouncer"
version = "0.1.0"
description = "Audit scientific papers for computational reproducibility — deterministic evidence gathering, JEV-judged checks, Orbit-driven reproduction."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "pydantic>=2.6",
    "diskcache>=5.6",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
reprobouncer = "reproducibility_bouncer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
